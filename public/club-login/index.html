<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to access Pivot club administration.">
  <meta name="robots" content="noindex,nofollow">
  <title>Club Login | Pivot Teamwear</title>
  <link rel="icon" href="/brand/Pivot_Icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/club-login/club-login.css?v=20260805-1">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="login-header">
    <a href="/club-store/index.html" aria-label="Return to Club Stores">
      <img src="/brand/Pivot_Logo_Transparent.svg" alt="Pivot Teamwear" width="330" height="145">
    </a>
  </header>

  <main id="main" tabindex="-1">
    <section class="login-panel" aria-labelledby="club-login-title">
      <h1 id="club-login-title">Club login</h1>
      <p class="login-intro">Sign in to access your club administration.</p>

      <form aria-describedby="login-status">
        <label for="club-login-email">Email address</label>
        <input id="club-login-email" type="email" autocomplete="email" disabled>
        <button type="submit" disabled>Send sign-in link</button>
      </form>

      <p class="login-status" id="login-status"><strong>Local/testing status:</strong> Authentication is not yet connected. This form will not send a sign-in link.</p>
    </section>
  </main>

  <footer>© 2026 Pivot Teamwear</footer>
</body>
</html>
